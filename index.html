<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>點名小幫手</title>
  <link rel="stylesheet" href="main.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fafafa;
      display: flex;
      touch-action: none;
    }
    #app { display: none; flex: 1; }
    body.unlocked #app { display: flex; }
    .grid {
      flex: 1;
      display: grid;
      gap: 4px;
      padding: 4px;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 1fr);
    }
    @media (orientation: landscape) {
      .grid {
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }
    }
    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(5, 1fr);
      }
    }
    .cell {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      padding: 4px;
      text-align: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .cell.on { background: #c8e6c9; border-color: #4caf50; }
    .cell .name { font-weight: 500; margin-bottom: 4px; word-break: break-word; font-size: 1.3rem; }
    .cell .status { color: #888; font-weight: 600; letter-spacing: .5px; font-size: 1rem; }
    @media (min-width: 768px) {
      .cell .name { font-size: 1.5rem; }
      .cell .status { font-size: 1.2rem; }
    }
    .cell.on .status { color: #2e7d32; }
    .cell.empty {
      border: 1px dashed #e0e0e0;
      background: transparent;
      pointer-events: none;
    }

    /* 排序（編輯）模式 */
    body.editing .cell:not(.empty) { animation: wiggle .32s infinite alternate ease-in-out; }
    @keyframes wiggle {
      from { transform: rotate(-.7deg); }
      to { transform: rotate(.7deg); }
    }
    .cell.dragging {
      animation: none !important;
      z-index: 10;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .25);
      opacity: .92;
      pointer-events: none;
    }
    /* 編輯模式讓 grid 讓出底部空間，否則工具列會蓋住最後一排、那幾格就拖不到 */
    body.editing .grid { padding-bottom: 60px; }
    #bar {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      /* fixed + left:50% 會讓可用寬度只剩一半，按鈕文字因此被擠成兩行 */
      width: max-content;
      max-width: calc(100vw - 24px);
      gap: 8px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 6px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
      z-index: 20;
    }
    body.editing #bar { display: flex; }
    #bar button {
      font: inherit;
      font-size: .95rem;
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: #eee;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    #bar button.primary { background: #4caf50; color: #fff; font-weight: 600; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 68px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .78);
      color: #fff;
      font-size: .9rem;
      padding: 8px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 30;
    }
    #toast.show { opacity: 1; }
    #qq { position: fixed; bottom: 0; right: 0; }
  </style>
</head>

<body>
  <div id="app"><div class="grid" id="grid"></div></div>
  <div id="bar">
    <button type="button" id="clearBtn">全部清除</button>
    <button type="button" id="shareBtn">複製連結</button>
    <button type="button" id="doneBtn" class="primary">完成</button>
  </div>
  <div id="toast"></div>
  <div id="qq">v26.7.30</div>
  <script>
    const SECRET = '#9527';
    const LONG_PRESS_MS = 500;
    // 超過這個位移就判定為「連刷開關」，同時把長按計時器讓掉
    const SWEEP_THRESHOLD = 16;

    const names = ["順利", "宗佑", "書聿", "政儒", "宥呈", "慈憶", "股中", "奕閎", "玉莉", "敬耀", "翊誠", "俞萱", "柏亦", "長緯", "倫紳", "珮綺", "冀昕", "怡秀", "堯堯", "季橫"];

    // order 是顯示順序（存 names 的索引）；states 一律以 names 的原始索引為 key
    let order = names.map((_, i) => i);
    let states = new Array(names.length).fill(false);

    const grid = document.getElementById('grid');
    const toast = document.getElementById('toast');

    /* ---------- 編碼 / 解碼：順序與狀態都放進查詢字串，方便分享 ---------- */

    // 單字元 base36，最多支援 36 個名字；超過時解碼會驗證失敗並退回預設順序
    function encodeOrder(list) {
      return list.map(i => i.toString(36)).join('');
    }

    function decodeOrder(str) {
      if (!str) return null;
      const seen = new Set();
      const out = [];
      for (const ch of str) {
        const i = parseInt(ch, 36);
        if (Number.isNaN(i) || i < 0 || i >= names.length || seen.has(i)) continue;
        seen.add(i);
        out.push(i);
      }
      if (!out.length) return null;
      // 名單日後增加時，沒出現在連結裡的名字補到最後
      for (let i = 0; i < names.length; i++) if (!seen.has(i)) out.push(i);
      return out;
    }

    // 用乘除而非位元運算，避免名單超過 32 人時溢位
    function encodeStates(list) {
      let n = 0;
      list.forEach((on, i) => { if (on) n += 2 ** i; });
      return n.toString(36);
    }

    function decodeStates(str) {
      if (!str) return null;
      const n = parseInt(str, 36);
      if (!Number.isFinite(n) || n < 0) return null;
      return names.map((_, i) => Math.floor(n / 2 ** i) % 2 === 1);
    }

    function load() {
      const q = new URLSearchParams(location.search);
      const o = decodeOrder(q.get('o'));
      const s = decodeStates(q.get('s'));
      if (o) order = o;
      if (s) states = s;
    }

    // 網址就是唯一的儲存位置：沒有查詢字串就是全新開始
    function save() {
      const o = encodeOrder(order);
      const s = encodeStates(states);
      try {
        // hash 是解鎖碼，必須保留，分享出去的連結才能直接開
        history.replaceState(null, '', `${location.pathname}?o=${o}&s=${s}${location.hash}`);
      } catch (e) { /* file:// 之類的環境會擋 replaceState，此時只存在記憶體裡 */ }
    }

    /* ---------- 畫面 ---------- */

    let builtCount = 0;

    function cellCount() {
      if (window.matchMedia('(min-width: 768px)').matches) return 25;
      return 24;
    }

    function paint(cell) {
      const idx = Number(cell.dataset.idx);
      const on = !!states[idx];
      cell.classList.toggle('on', on);
      cell.querySelector('.status').textContent = on ? 'ON' : 'OFF';
    }

    function buildGrid() {
      const total = cellCount();
      grid.innerHTML = '';
      order.slice(0, total).forEach(idx => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.idx = idx;
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = names[idx];
        const status = document.createElement('div');
        status.className = 'status';
        cell.append(name, status);
        paint(cell);
        grid.appendChild(cell);
      });
      for (let i = grid.childElementCount; i < total; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell empty';
        grid.appendChild(cell);
      }
      builtCount = total;
    }

    function render() {
      const unlocked = location.hash === SECRET;
      document.body.classList.toggle('unlocked', unlocked);
      if (unlocked) buildGrid();
    }

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    /* ---------- 切換 ---------- */

    function setState(cell, on) {
      const idx = Number(cell.dataset.idx);
      if (Number.isNaN(idx)) return;
      states[idx] = !!on;
      paint(cell);
    }

    function toggle(cell) {
      const idx = Number(cell.dataset.idx);
      if (Number.isNaN(idx)) return;
      setState(cell, !states[idx]);
      save();
    }

    function clearAll() {
      states = states.map(() => false);
      grid.querySelectorAll('.cell:not(.empty)').forEach(paint);
      save();
      showToast('已全部清除');
    }

    /* ---------- 編輯（排序）模式 ---------- */

    let editing = false;

    function enterEdit() {
      editing = true;
      document.body.classList.add('editing');
      if (navigator.vibrate) navigator.vibrate(15);
    }

    function exitEdit() {
      editing = false;
      document.body.classList.remove('editing');
    }

    /* ---------- 拖曳連刷（一般模式）---------- */

    let sweeping = false;
    let sweepTarget = null;          // 這一趟要把經過的格子都刷成什麼
    const sweepPath = [];            // 依序經過的格子
    const sweepFrom = new Map();     // 每格進入前的原狀態，倒退時用來還原

    function beginSweep(cell) {
      sweeping = true;
      // 起點格的反向狀態決定整趟的方向：從 OFF 起跑就是一路開，反之一路關
      sweepTarget = !states[Number(cell.dataset.idx)];
      sweepPath.length = 0;
      sweepFrom.clear();
      sweepTo(cell);
    }

    function sweepTo(cell) {
      if (!cell || cell === sweepPath[sweepPath.length - 1]) return;
      const at = sweepPath.indexOf(cell);
      if (at >= 0) {
        // 往回刷：把這格之後經過的都還原，所以刷過頭可以直接退回來
        for (let i = sweepPath.length - 1; i > at; i--) {
          const c = sweepPath[i];
          setState(c, sweepFrom.get(c));
          sweepFrom.delete(c);
        }
        sweepPath.length = at + 1;
        return;
      }
      sweepFrom.set(cell, !!states[Number(cell.dataset.idx)]);
      setState(cell, sweepTarget);
      sweepPath.push(cell);
    }

    function endSweep() {
      sweeping = false;
      sweepTarget = null;
      sweepPath.length = 0;
      sweepFrom.clear();
      save();   // 整趟刷完才寫一次，中途不去動網址
    }

    /* ---------- 拖曳重排（編輯模式）---------- */

    let dragCell = null;
    let grabX = 0, grabY = 0;

    function cellAt(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const c = el.closest('.cell');
      if (!c || c.classList.contains('empty')) return null;
      return c;
    }

    // 先清掉 transform 量出格子在版面上的原位，再位移到手指底下；
    // 這樣拖曳中即使 DOM 順序變了，位置也會自動校正
    function moveDragTo(x, y) {
      dragCell.style.transform = '';
      const home = dragCell.getBoundingClientRect();
      dragCell.style.transform = `translate(${x - grabX - home.left}px, ${y - grabY - home.top}px)`;
    }

    function beginDrag(cell, x, y) {
      press = null;
      dragCell = cell;
      const r = cell.getBoundingClientRect();
      grabX = x - r.left;
      grabY = y - r.top;
      cell.classList.add('dragging');
      moveDragTo(x, y);
    }

    function dragOver(x, y) {
      const target = cellAt(x, y);
      if (!target || target === dragCell) return;
      const cells = [...grid.children];
      if (cells.indexOf(dragCell) < cells.indexOf(target)) target.after(dragCell);
      else target.before(dragCell);
    }

    function endDrag() {
      if (!dragCell) return;
      dragCell.classList.remove('dragging');
      dragCell.style.transform = '';
      dragCell = null;
      // 佔位的空格永遠留在尾端，不會被拖進來，所以只收非空格子
      const shown = [...grid.children]
        .filter(c => !c.classList.contains('empty'))
        .map(c => Number(c.dataset.idx));
      // 超出畫面格數而沒被渲染出來的名字，順序照舊接在後面
      order = shown.concat(order.filter(i => !shown.includes(i)));
      save();
    }

    /* ---------- 手勢 ---------- */

    let press = null;

    function cancelPress() {
      if (!press) return;
      clearTimeout(press.timer);
      press = null;
    }

    grid.addEventListener('pointerdown', e => {
      e.preventDefault();
      const cell = cellAt(e.clientX, e.clientY);
      if (!cell) {
        if (editing) exitEdit();
        return;
      }
      if (editing) {
        beginDrag(cell, e.clientX, e.clientY);
        return;
      }
      // 按住不動 → 排序模式；按住後滑動 → 連刷開關；點一下放開 → 切單一格
      press = { cell, x: e.clientX, y: e.clientY };
      press.timer = setTimeout(() => {
        const p = press;
        enterEdit();
        beginDrag(p.cell, p.lx ?? p.x, p.ly ?? p.y);   // 會順手把 press 清掉
      }, LONG_PRESS_MS);
    });

    document.addEventListener('pointermove', e => {
      if (dragCell) {
        dragOver(e.clientX, e.clientY);
        moveDragTo(e.clientX, e.clientY);
        return;
      }
      if (sweeping) {
        sweepTo(cellAt(e.clientX, e.clientY));
        return;
      }
      if (!press) return;
      press.lx = e.clientX;
      press.ly = e.clientY;
      if (Math.hypot(e.clientX - press.x, e.clientY - press.y) <= SWEEP_THRESHOLD) return;
      const cell = press.cell;
      cancelPress();          // 位移夠大就不再等長按，改判定為連刷
      beginSweep(cell);
      sweepTo(cellAt(e.clientX, e.clientY));
    });

    document.addEventListener('pointerup', () => {
      if (dragCell) { endDrag(); return; }
      if (sweeping) { endSweep(); return; }
      if (!press) return;     // 已轉為排序拖曳
      const cell = press.cell;
      cancelPress();
      toggle(cell);
    });

    document.addEventListener('pointercancel', () => {
      if (dragCell) endDrag();
      if (sweeping) endSweep();
      cancelPress();
    });

    document.addEventListener('contextmenu', e => {
      if (document.body.classList.contains('unlocked')) e.preventDefault();
    });

    window.addEventListener('resize', () => {
      if (!document.body.classList.contains('unlocked')) return;
      if (dragCell || cellCount() === builtCount) return;
      buildGrid();
    });

    /* ---------- 工具列 ---------- */

    document.getElementById('doneBtn').addEventListener('click', exitEdit);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('shareBtn').addEventListener('click', async () => {
      save();
      const url = location.href;
      try {
        await navigator.clipboard.writeText(url);
        showToast('已複製連結');
      } catch (e) {
        // 非 https 或舊瀏覽器沒有 clipboard API
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        showToast(ok ? '已複製連結' : '複製失敗，請直接複製網址列');
      }
    });

    window.addEventListener('hashchange', render);
    load();
    render();
  </script>
</body>

</html>
