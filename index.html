<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>點名小幫手</title>
  <link rel="stylesheet" href="main.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fafafa;
      display: flex;
      touch-action: none;
    }
    #app { display: none; flex: 1; }
    body.unlocked #app { display: flex; flex-direction: column; min-width: 0; }
    .grid {
      flex: 1;
      display: grid;
      gap: 4px;
      padding: 4px;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 1fr);
    }
    @media (orientation: landscape) {
      .grid {
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }
    }
    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(5, 1fr);
      }
    }
    .cell {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      padding: 4px;
      text-align: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .cell.on { background: #c8e6c9; border-color: #4caf50; }
    .cell .name { font-weight: 500; margin-bottom: 4px; word-break: break-word; font-size: 1.3rem; }
    .cell .status { color: #888; font-weight: 600; letter-spacing: .5px; font-size: 1rem; }
    @media (min-width: 768px) {
      .cell .name { font-size: 1.5rem; }
      .cell .status { font-size: 1.2rem; }
    }
    .cell.on .status { color: #2e7d32; }
    .cell.empty {
      border: 1px dashed #e0e0e0;
      background: transparent;
      pointer-events: none;
    }

    /* 排序（編輯）模式 */
    body.editing .cell:not(.empty) { animation: wiggle .32s infinite alternate ease-in-out; }
    @keyframes wiggle {
      from { transform: rotate(-.7deg); }
      to { transform: rotate(.7deg); }
    }
    .cell.dragging {
      animation: none !important;
      z-index: 10;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .25);
      opacity: .92;
      pointer-events: none;
    }
    /* 編輯模式讓 grid 讓出底部空間，否則工具列會蓋住最後一排、那幾格就拖不到 */
    body.editing .grid { padding-bottom: 60px; }
    #bar {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      /* fixed + left:50% 會讓可用寬度只剩一半，按鈕文字因此被擠成兩行 */
      width: max-content;
      max-width: calc(100vw - 24px);
      gap: 8px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 6px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
      z-index: 20;
    }
    body.editing #bar { display: flex; }
    #bar button {
      font: inherit;
      font-size: .95rem;
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: #eee;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    #bar button.primary { background: #4caf50; color: #fff; font-weight: 600; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 68px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .78);
      color: #fff;
      font-size: .9rem;
      padding: 8px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 30;
    }
    #toast.show { opacity: 1; }

    /* 登入 */
    #login { flex: 1; display: flex; align-items: center; justify-content: center; }
    body.unlocked #login { display: none; }
    #login form { display: flex; flex-direction: column; gap: 10px; width: min(280px, calc(100vw - 32px)); }
    #login input, #login button { font: inherit; font-size: 1.1rem; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; }
    #login button { background: #4caf50; border-color: #4caf50; color: #fff; font-weight: 600; cursor: pointer; }
    #loginMsg { color: #c62828; min-height: 1.4em; font-size: .95rem; }

    /* 上方工具列：步驟提示、儲存狀態、新舊版切換 */
    #top { display: flex; align-items: center; gap: 8px; padding: 6px 8px 2px; font-size: 1.1rem; }
    #hint { flex: 1; font-weight: 600; min-width: 0; }
    #status { color: #888; font-size: .95rem; white-space: nowrap; }
    #status.error { color: #c62828; cursor: pointer; text-decoration: underline; }
    #modeBtn { font: inherit; font-size: .85rem; border: 1px solid #ccc; background: #fff; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
    #ver { color: #aaa; font-size: .75rem; }

    #pick, #legacy { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    body.mode-legacy #pick, body:not(.mode-legacy) #legacy { display: none; }

    /* 新版：上方候選名單、分隔線、下方已選名單 */
    .pgrid { display: grid; gap: 4px; padding: 4px; }
    #upper { flex: 1; min-height: 0; }
    #lower { grid-auto-rows: 72px; }
    #pick hr { width: calc(100% - 16px); margin: 4px 8px; border: 0; border-top: 2px solid #bbb; }
    .cell.done .status { color: #999; font-weight: 400; font-size: .85rem; white-space: nowrap; letter-spacing: 0; }
    .cell.suggest { border-color: #ffb300; }
    .cell.suggest .status { color: #ff8f00; }
    .cell.interviewer { background: #ffe0b2; border-color: #fb8c00; }
    .cell.interviewer .status { color: #e65100; }
    .cell.interviewer.swapping { outline: 3px dashed #e65100; outline-offset: -3px; }
  </style>
</head>

<body>
  <div id="login">
    <form id="loginForm">
      <input type="password" id="pwInput" placeholder="密碼" autocomplete="current-password">
      <button type="submit">登入</button>
      <div id="loginMsg"></div>
    </form>
  </div>
  <div id="app">
    <div id="top">
      <span id="hint"></span>
      <span id="status"></span>
      <button type="button" id="modeBtn"></button>
      <span id="ver">v26.10.7</span>
    </div>
    <div id="pick">
      <div class="pgrid" id="upper"></div>
      <hr>
      <div class="pgrid" id="lower"></div>
    </div>
    <div id="legacy"><div class="grid" id="grid"></div></div>
  </div>
  <div id="bar">
    <button type="button" id="clearBtn">全部清除</button>
    <button type="button" id="shareBtn">複製連結</button>
    <button type="button" id="doneBtn" class="primary">完成</button>
  </div>
  <div id="toast"></div>
  <script>
    // Apps Script 部署後拿到的網址，見 README
    const API_URL = 'https://script.google.com/macros/s/AKfycbybLMFWzreAFjKeh1JFz74nggYevmoOcm9BSfJpkt5Y-I3ckjKtaRrIrs5Qz3vIrSi5AQ/exec';
    const LONG_PRESS_MS = 500;
    // 超過這個位移就判定為「連刷開關」，同時把長按計時器讓掉
    const SWEEP_THRESHOLD = 16;

    // 舊版（全員 ON/OFF）用的名單，登入後由試算表的 Members 帶入
    let names = [];

    // order 是顯示順序（存 names 的索引）；states 一律以 names 的原始索引為 key
    let order = [];
    let states = [];

    const grid = document.getElementById('grid');
    const toast = document.getElementById('toast');

    /* ---------- 編碼 / 解碼：順序與狀態都放進查詢字串，方便分享 ---------- */

    // 單字元 base36，最多支援 36 個名字；超過時解碼會驗證失敗並退回預設順序
    function encodeOrder(list) {
      return list.map(i => i.toString(36)).join('');
    }

    function decodeOrder(str) {
      if (!str) return null;
      const seen = new Set();
      const out = [];
      for (const ch of str) {
        const i = parseInt(ch, 36);
        if (Number.isNaN(i) || i < 0 || i >= names.length || seen.has(i)) continue;
        seen.add(i);
        out.push(i);
      }
      if (!out.length) return null;
      // 名單日後增加時，沒出現在連結裡的名字補到最後
      for (let i = 0; i < names.length; i++) if (!seen.has(i)) out.push(i);
      return out;
    }

    // 用乘除而非位元運算，避免名單超過 32 人時溢位
    function encodeStates(list) {
      let n = 0;
      list.forEach((on, i) => { if (on) n += 2 ** i; });
      return n.toString(36);
    }

    function decodeStates(str) {
      if (!str) return null;
      const n = parseInt(str, 36);
      if (!Number.isFinite(n) || n < 0) return null;
      return names.map((_, i) => Math.floor(n / 2 ** i) % 2 === 1);
    }

    function load() {
      order = names.map((_, i) => i);
      states = new Array(names.length).fill(false);
      const q = new URLSearchParams(location.search);
      const o = decodeOrder(q.get('o'));
      const s = decodeStates(q.get('s'));
      if (o) order = o;
      if (s) states = s;
    }

    // 網址就是唯一的儲存位置：沒有查詢字串就是全新開始
    function save() {
      const o = encodeOrder(order);
      const s = encodeStates(states);
      try {
        history.replaceState(null, '', `${location.pathname}?o=${o}&s=${s}`);
      } catch (e) { /* file:// 之類的環境會擋 replaceState，此時只存在記憶體裡 */ }
    }

    /* ---------- 畫面 ---------- */

    let builtCount = 0;

    function cellCount() {
      if (window.matchMedia('(min-width: 768px)').matches) return 25;
      return 24;
    }

    function paint(cell) {
      const idx = Number(cell.dataset.idx);
      const on = !!states[idx];
      cell.classList.toggle('on', on);
      cell.querySelector('.status').textContent = on ? 'ON' : 'OFF';
    }

    function buildGrid() {
      const total = cellCount();
      grid.innerHTML = '';
      order.slice(0, total).forEach(idx => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.idx = idx;
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = names[idx];
        const status = document.createElement('div');
        status.className = 'status';
        cell.append(name, status);
        paint(cell);
        grid.appendChild(cell);
      });
      for (let i = grid.childElementCount; i < total; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell empty';
        grid.appendChild(cell);
      }
      builtCount = total;
    }

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    /* ---------- 切換 ---------- */

    function setState(cell, on) {
      const idx = Number(cell.dataset.idx);
      if (Number.isNaN(idx)) return;
      states[idx] = !!on;
      paint(cell);
    }

    function toggle(cell) {
      const idx = Number(cell.dataset.idx);
      if (Number.isNaN(idx)) return;
      setState(cell, !states[idx]);
      save();
    }

    function clearAll() {
      states = states.map(() => false);
      grid.querySelectorAll('.cell:not(.empty)').forEach(paint);
      save();
      showToast('已全部清除');
    }

    /* ---------- 編輯（排序）模式 ---------- */

    let editing = false;

    function enterEdit() {
      editing = true;
      document.body.classList.add('editing');
      if (navigator.vibrate) navigator.vibrate(15);
    }

    function exitEdit() {
      editing = false;
      document.body.classList.remove('editing');
    }

    /* ---------- 拖曳連刷（一般模式）---------- */

    let sweeping = false;
    let sweepTarget = null;          // 這一趟要把經過的格子都刷成什麼
    const sweepPath = [];            // 依序經過的格子
    const sweepFrom = new Map();     // 每格進入前的原狀態，倒退時用來還原

    function beginSweep(cell) {
      sweeping = true;
      // 起點格的反向狀態決定整趟的方向：從 OFF 起跑就是一路開，反之一路關
      sweepTarget = !states[Number(cell.dataset.idx)];
      sweepPath.length = 0;
      sweepFrom.clear();
      sweepTo(cell);
    }

    function sweepTo(cell) {
      if (!cell || cell === sweepPath[sweepPath.length - 1]) return;
      const at = sweepPath.indexOf(cell);
      if (at >= 0) {
        // 往回刷：把這格之後經過的都還原，所以刷過頭可以直接退回來
        for (let i = sweepPath.length - 1; i > at; i--) {
          const c = sweepPath[i];
          setState(c, sweepFrom.get(c));
          sweepFrom.delete(c);
        }
        sweepPath.length = at + 1;
        return;
      }
      sweepFrom.set(cell, !!states[Number(cell.dataset.idx)]);
      setState(cell, sweepTarget);
      sweepPath.push(cell);
    }

    function endSweep() {
      sweeping = false;
      sweepTarget = null;
      sweepPath.length = 0;
      sweepFrom.clear();
      save();   // 整趟刷完才寫一次，中途不去動網址
    }

    /* ---------- 拖曳重排（編輯模式）---------- */

    let dragCell = null;
    let grabX = 0, grabY = 0;

    function cellAt(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const c = el.closest('.cell');
      if (!c || c.classList.contains('empty')) return null;
      return c;
    }

    // 先清掉 transform 量出格子在版面上的原位，再位移到手指底下；
    // 這樣拖曳中即使 DOM 順序變了，位置也會自動校正
    function moveDragTo(x, y) {
      dragCell.style.transform = '';
      const home = dragCell.getBoundingClientRect();
      dragCell.style.transform = `translate(${x - grabX - home.left}px, ${y - grabY - home.top}px)`;
    }

    function beginDrag(cell, x, y) {
      press = null;
      dragCell = cell;
      const r = cell.getBoundingClientRect();
      grabX = x - r.left;
      grabY = y - r.top;
      cell.classList.add('dragging');
      moveDragTo(x, y);
    }

    function dragOver(x, y) {
      const target = cellAt(x, y);
      if (!target || target === dragCell) return;
      const cells = [...grid.children];
      if (cells.indexOf(dragCell) < cells.indexOf(target)) target.after(dragCell);
      else target.before(dragCell);
    }

    function endDrag() {
      if (!dragCell) return;
      dragCell.classList.remove('dragging');
      dragCell.style.transform = '';
      dragCell = null;
      // 佔位的空格永遠留在尾端，不會被拖進來，所以只收非空格子
      const shown = [...grid.children]
        .filter(c => !c.classList.contains('empty'))
        .map(c => Number(c.dataset.idx));
      // 超出畫面格數而沒被渲染出來的名字，順序照舊接在後面
      order = shown.concat(order.filter(i => !shown.includes(i)));
      save();
    }

    /* ---------- 手勢 ---------- */

    let press = null;

    function cancelPress() {
      if (!press) return;
      clearTimeout(press.timer);
      press = null;
    }

    grid.addEventListener('pointerdown', e => {
      e.preventDefault();
      const cell = cellAt(e.clientX, e.clientY);
      if (!cell) {
        if (editing) exitEdit();
        return;
      }
      if (editing) {
        beginDrag(cell, e.clientX, e.clientY);
        return;
      }
      // 按住不動 → 排序模式；按住後滑動 → 連刷開關；點一下放開 → 切單一格
      press = { cell, x: e.clientX, y: e.clientY };
      press.timer = setTimeout(() => {
        const p = press;
        enterEdit();
        beginDrag(p.cell, p.lx ?? p.x, p.ly ?? p.y);   // 會順手把 press 清掉
      }, LONG_PRESS_MS);
    });

    document.addEventListener('pointermove', e => {
      if (dragCell) {
        dragOver(e.clientX, e.clientY);
        moveDragTo(e.clientX, e.clientY);
        return;
      }
      if (sweeping) {
        sweepTo(cellAt(e.clientX, e.clientY));
        return;
      }
      if (!press) return;
      press.lx = e.clientX;
      press.ly = e.clientY;
      if (Math.hypot(e.clientX - press.x, e.clientY - press.y) <= SWEEP_THRESHOLD) return;
      const cell = press.cell;
      cancelPress();          // 位移夠大就不再等長按，改判定為連刷
      beginSweep(cell);
      sweepTo(cellAt(e.clientX, e.clientY));
    });

    document.addEventListener('pointerup', () => {
      if (dragCell) { endDrag(); return; }
      if (sweeping) { endSweep(); return; }
      if (!press) return;     // 已轉為排序拖曳
      const cell = press.cell;
      cancelPress();
      toggle(cell);
    });

    document.addEventListener('pointercancel', () => {
      if (dragCell) endDrag();
      if (sweeping) endSweep();
      cancelPress();
    });

    document.addEventListener('contextmenu', e => {
      if (document.body.classList.contains('unlocked')) e.preventDefault();
    });

    window.addEventListener('resize', () => {
      if (mode !== 'legacy') return;
      if (dragCell || cellCount() === builtCount) return;
      buildGrid();
    });

    /* ---------- 工具列 ---------- */

    document.getElementById('doneBtn').addEventListener('click', exitEdit);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('shareBtn').addEventListener('click', async () => {
      save();
      const url = location.href;
      try {
        await navigator.clipboard.writeText(url);
        showToast('已複製連結');
      } catch (e) {
        // 非 https 或舊瀏覽器沒有 clipboard API
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        showToast(ok ? '已複製連結' : '複製失敗，請直接複製網址列');
      }
    });

    /* ====================================================================
     * 新版：一次只點幾位受訪人，紀錄存在 Google 試算表
     * ==================================================================== */

    const upperEl = document.getElementById('upper');
    const lowerEl = document.getElementById('lower');
    const hintEl = document.getElementById('hint');
    const statusEl = document.getElementById('status');
    const modeBtn = document.getElementById('modeBtn');

    let password = '';
    let mode = 'pick';          // 'pick' 新版 | 'legacy' 舊版
    let members = [];           // 在名單內的人，依 Members 分頁的列順序
    let records = [];           // [{ date, interviewer, interviewee }]
    const today = localDate(new Date());

    // 今天這一場的狀態；一天一場，存檔時整批取代當天的列
    let interviewer = null;
    let interviewees = [];
    let swapping = false;       // 點了訪談者、正在等使用者點新的訪談者

    function localDate(d) {
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }

    function store(key, value) {
      try {
        if (value == null) localStorage.removeItem(key);
        else localStorage.setItem(key, value);
      } catch (e) { /* 無痕模式之類會擋，下次重新輸入就好 */ }
    }

    function stored(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    // 不帶 Content-Type，瀏覽器會當成 text/plain 的簡單請求，不會觸發 Apps Script 回應不了的 CORS 預檢
    async function api(payload) {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ ...payload, password }) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error === 'unauthorized') { lock('密碼錯誤'); throw new Error('unauthorized'); }
      if (!data.ok) throw new Error(data.error || 'failed');
      return data;
    }

    /* ---------- 輪次：誰在這一輪已經被點過 ---------- */

    // 從最舊的紀錄依序重播：這一輪點過的人放進 picked，
    // 等所有候選人都點過一次（一輪結束）就清空重來；同一天跨輪時，被點第二次的人算進新的一輪。
    // 回傳 Map(名字 → 這一輪被點的日期)；空的就是「全新一輪」。今天的紀錄不算，名單才不會邊點邊重排。
    function currentCycle(candidates) {
      const cand = new Set(candidates);
      const days = new Map();
      for (const r of records) {
        if (r.date >= today || !cand.has(r.interviewee)) continue;
        if (!days.has(r.date)) days.set(r.date, []);
        days.get(r.date).push(r.interviewee);
      }
      let picked = new Map();
      for (const date of [...days.keys()].sort()) {
        const p = days.get(date);
        if (candidates.every(n => picked.has(n) || p.includes(n))) {
          const next = new Map();
          for (const n of p) if (picked.has(n)) next.set(n, date);
          picked = next;
        } else {
          for (const n of p) picked.set(n, date);
        }
      }
      return picked;
    }

    // 最近一次（今天以前）的訪談者，第一步把他排在第一格，通常點一下就好
    function lastInterviewer() {
      let last = null;
      for (const r of records) if (r.date < today && (!last || r.date >= last.date)) last = r;
      return last && last.interviewer;
    }

    /* ---------- 畫面 ---------- */

    function columns() {
      if (window.matchMedia('(min-width: 768px)').matches) return 5;
      if (window.matchMedia('(orientation: landscape)').matches) return 6;
      return 4;
    }

    function makeCell(item) {
      const c = document.createElement('div');
      if (!item) { c.className = 'cell empty'; return c; }
      c.className = 'cell' + (item.cls ? ` ${item.cls}` : '');
      c.dataset.name = item.name;
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.name;
      const status = document.createElement('div');
      status.className = 'status';
      status.textContent = item.sub || '';
      c.append(name, status);
      return c;
    }

    function fill(el, items, slots, cols) {
      el.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      el.replaceChildren(...items.map(makeCell));
      for (let i = items.length; i < slots; i++) el.appendChild(makeCell(null));
    }

    function renderPick() {
      const cols = columns();
      const chosen = new Set([interviewer, ...interviewees]);
      let upper;
      let fresh = false;
      if (!interviewer) {
        const last = lastInterviewer();
        const first = members.includes(last) ? [{ name: last, sub: '上次訪談者', cls: 'suggest' }] : [];
        upper = first.concat(members.filter(n => n !== last).map(name => ({ name })));
      } else {
        const candidates = members.filter(n => n !== interviewer);
        const picked = currentCycle(candidates);
        fresh = picked.size === 0;
        const left = candidates.filter(n => !chosen.has(n));
        const done = left.filter(n => picked.has(n))
          .sort((a, b) => picked.get(a).localeCompare(picked.get(b)));   // 同一天的維持名單順序
        upper = left.filter(n => !picked.has(n)).map(name => ({ name }))
          .concat(done.map(name => ({ name, sub: picked.get(name), cls: 'done' })));
      }

      // 上方格數固定為全體人數，名字移下去時版面不會跳動
      const rows = Math.max(1, Math.ceil(members.length / cols));
      upperEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      fill(upperEl, upper, rows * cols, cols);

      const lower = [];
      if (interviewer) lower.push({ name: interviewer, sub: '訪談者', cls: 'interviewer' + (swapping ? ' swapping' : '') });
      interviewees.forEach(name => lower.push({ name, sub: '受訪人', cls: 'on' }));
      fill(lowerEl, lower, Math.max(1, Math.ceil(lower.length / cols)) * cols, cols);

      if (!interviewer) hintEl.textContent = '① 請點選訪談者';
      else if (swapping) hintEl.textContent = '請點選新的訪談者（再點一次訪談者取消）';
      else hintEl.textContent = `② 請點選受訪人${interviewees.length ? `（已選 ${interviewees.length} 位）` : ''}${fresh ? '・新的一輪' : ''}`;
    }

    upperEl.addEventListener('click', e => {
      const c = e.target.closest('.cell[data-name]');
      if (!c) return;
      const name = c.dataset.name;
      if (!interviewer) {
        interviewer = name;               // 只有訪談者還沒有紀錄可存，等點了受訪人才寫入
      } else if (swapping) {
        interviewer = name;               // 原訪談者回到上方，受訪人保留
        swapping = false;
        queueSave();
      } else {
        interviewees.push(name);
        queueSave();
      }
      renderPick();
    });

    lowerEl.addEventListener('click', e => {
      const c = e.target.closest('.cell[data-name]');
      if (!c) return;
      const name = c.dataset.name;
      if (name === interviewer) {
        if (interviewees.length) swapping = !swapping;
        else interviewer = null;          // 還沒點受訪人，直接退回第一步
      } else if (swapping) {
        // 換訪談者時點下方的受訪人：他改當訪談者，原訪談者回到上方
        interviewees = interviewees.filter(n => n !== name);
        interviewer = name;
        swapping = false;
        queueSave();
      } else {
        interviewees = interviewees.filter(n => n !== name);
        queueSave();
      }
      renderPick();
    });

    /* ---------- 自動存檔 ---------- */

    // 每次送的都是今天的完整狀態，所以連點時只要送最新的一份；同時間只有一個請求在跑
    let saving = false;
    let pending = false;
    let failed = false;

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.classList.toggle('error', !!isError);
    }

    function queueSave() {
      pending = true;
      pump();
    }

    async function pump() {
      if (saving || !pending) return;
      pending = false;
      saving = true;
      setStatus('儲存中…');
      try {
        await api({ action: 'saveDay', date: today, interviewer: interviewer || '', interviewees: [...interviewees] });
        failed = false;
      } catch (e) {
        failed = true;
      }
      saving = false;
      if (pending) pump();
      else if (failed) setStatus('✗ 儲存失敗，點此重試', true);
      else setStatus('✓ 已儲存');
    }

    statusEl.addEventListener('click', () => {
      if (failed) queueSave();
    });

    window.addEventListener('beforeunload', e => {
      if (saving || pending || failed) { e.preventDefault(); e.returnValue = ''; }
    });

    /* ---------- 模式切換 ---------- */

    function setMode(m) {
      mode = m === 'legacy' ? 'legacy' : 'pick';
      store('mode', mode);
      if (editing) exitEdit();
      document.body.classList.toggle('mode-legacy', mode === 'legacy');
      modeBtn.textContent = mode === 'legacy' ? '新版' : '舊版';
      if (mode === 'legacy') {
        hintEl.textContent = '';
        buildGrid();
      } else {
        renderPick();
      }
    }

    modeBtn.addEventListener('click', () => setMode(mode === 'legacy' ? 'pick' : 'legacy'));

    window.addEventListener('resize', () => {
      if (mode === 'pick' && document.body.classList.contains('unlocked')) renderPick();
    });

    /* ---------- 登入與載入 ---------- */

    const loginMsg = document.getElementById('loginMsg');
    const pwInput = document.getElementById('pwInput');

    function lock(msg) {
      store('pw', null);
      document.body.classList.remove('unlocked');
      loginMsg.textContent = msg || '';
      pwInput.focus();
    }

    async function unlock(pw) {
      password = pw;
      loginMsg.textContent = '載入中…';
      let data;
      try {
        data = await api({ action: 'load' });
      } catch (e) {
        if (e.message !== 'unauthorized') loginMsg.textContent = `載入失敗（${e.message}），請稍後再試`;
        return;
      }
      store('pw', pw);
      loginMsg.textContent = '';
      members = data.members.filter(m => m.active).map(m => m.name);
      records = data.records;
      names = members;
      load();   // 舊版：從查詢字串還原順序與狀態

      // 重新整理或換裝置時，把今天已存的紀錄放回下方
      const todays = records.filter(r => r.date === today);
      if (todays.length) {
        interviewer = todays[0].interviewer || null;
        interviewees = [...new Set(todays.map(r => r.interviewee))].filter(n => n !== interviewer);
        if (!interviewer) interviewees = [];
      }

      document.body.classList.add('unlocked');
      setMode(stored('mode'));
    }

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      if (pwInput.value) unlock(pwInput.value);
    });

    if (API_URL.startsWith('REPLACE')) {
      loginMsg.textContent = '尚未設定 API_URL（見 README）';
    } else if (stored('pw')) {
      unlock(stored('pw'));
    }
  </script>
</body>

</html>
